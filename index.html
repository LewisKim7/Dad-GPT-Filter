<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>아빠의 GPT</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{display:flex;align-items:center;justify-content:center;color:#444}
    .status{font-size:16px}
  </style>
</head>
<body>
  <div class="status">아빠의 GPT 여는 중...</div>
  <script>
    (() => {
      const TARGET = 'https://chatgpt.com/g/g-p-6a7defb2053c8191ac660e89eb8680b6-abbayi-gpt/project';
      const DELAY_MS = 1000;
      let timer = null;

      function freshTarget() {
        const url = new URL(TARGET);
        url.searchParams.set('_dad_launch', Date.now().toString());
        return url.toString();
      }

      function launch() {
        if (timer) clearTimeout(timer);
        timer = setTimeout(() => {
          location.replace(freshTarget());
        }, DELAY_MS);
      }

      window.addEventListener('pageshow', launch);
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') launch();
      });
      launch();
    })();
  </script>
</body>
</html>
